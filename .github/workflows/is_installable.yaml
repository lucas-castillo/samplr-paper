on:
  push:
    branches: [main, master]
  pull_request:

name: Install Packages

permissions: read-all

jobs:
  install:
    
    runs-on: ${{ matrix.os }}

    name: ${{ matrix.os }} (${{ matrix.r }})

    strategy:
      fail-fast: false
      matrix:
        os:
            - ubuntu-latest
            - macos-latest
            - windows-latest
        r:
        - 'renv'
        
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4
      
      - name: Install linux dependencies
        run: sudo apt-get install libcurl4-openssl-dev libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev 
        shell: bash
        if: ${{matrix.os == 'ubuntu-latest'}}
        
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{matrix.r}}
          
          
      - uses: r-lib/actions/setup-renv@v2
        with:
          bypass-cache: false
      